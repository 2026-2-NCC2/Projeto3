services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: trocaticket-root-local
      MYSQL_DATABASE: trocaticket
      MYSQL_USER: trocaticket_app
      MYSQL_PASSWORD: trocaticket-demo-local
      TZ: America/Sao_Paulo
    volumes:
      - banco:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
      - ./db/commerce.sql:/docker-entrypoint-initdb.d/03-commerce.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql --protocol=tcp -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -Nse 'SELECT COUNT(*) FROM commerce_meta'"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 30s
  app:
    build: .
    environment:
      DB_HOST: db
      DB_USER: trocaticket_app
      DB_PASSWORD: trocaticket-demo-local
      NODE_ENV: development
      TZ: America/Sao_Paulo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
volumes:
  banco:
